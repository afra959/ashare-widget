plugins {
    id 'com.android.application'
}

android {
    namespace 'com.afra.podcast'
    compileSdk 34

    defaultConfig {
        applicationId "com.afra.podcast"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

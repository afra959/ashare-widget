name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          cat .buildsrc/chunk_*.b64 > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip
          test -f ashare_widget_project/settings.gradle

      - name: Apply v0.3.3 changes
        shell: bash
        run: |
          cp .patches/WidgetConfigActivity-v033.java             ashare_widget_project/app/src/main/java/com/eternal/asharewidget/WidgetConfigActivity.java

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("ashare_widget_project")

          # RemoteViews compatibility fix confirmed by the user's Android 14 / HyperOS logcat.
          p = root / "app/src/main/res/layout/widget_row.xml"
          s = p.read_text()
          s = re.sub(
              r'<View\s+android:layout_width="match_parent"\s+android:layout_height="1dp"\s+android:background="#293240"\s*/>',
              '<TextView\n        android:layout_width="match_parent"\n        android:layout_height="1dp"\n        android:background="#293240"\n        android:text="" />',
              s,
              flags=re.S,
          )
          p.write_text(s)

          # Fresh package id for this debug-signed build; avoids signature/cache conflicts
          # with v0.3.2. We can consolidate package/signing later.
          b = root / "app/build.gradle"
          t = b.read_text()
          t = re.sub(r"applicationId\s+'[^']+'", "applicationId 'com.eternal.asharewidget.v033'", t)
          t = re.sub(r"versionCode\s+\d+", "versionCode 6", t)
          t = re.sub(r"versionName\s+'[^']+'", "versionName '0.3.3'", t)
          b.write_text(t)

          m = root / "app/src/main/AndroidManifest.xml"
          u = m.read_text()
          u = u.replace('android:label="轻行情 Widget"', 'android:label="轻行情 0.3.3"')
          u = u.replace('android:name=".WidgetConfigActivity"', 'android:name="com.eternal.asharewidget.WidgetConfigActivity"')
          u = u.replace('android:name=".MainActivity"', 'android:name="com.eternal.asharewidget.MainActivity"')
          u = u.replace('android:name=".StockWidgetProvider"', 'android:name="com.eternal.asharewidget.StockWidgetProvider"')
          m.write_text(u)

          bad = []
          for q in (root / "app/src/main/res/layout").glob("widget_*.xml"):
              txt = q.read_text()
              if re.search(r'<(?:android\.view\.)?View(?:\s|>)', txt):
                  bad.append(str(q))
          if bad:
              raise SystemExit("Unsupported View still present: " + ", ".join(bad))

          cfg = root / "app/src/main/java/com/eternal/asharewidget/WidgetConfigActivity.java"
          cfg_text = cfg.read_text()
          required = ["已设置的提醒", "保存修改", "删除", "腾讯财经", "Yahoo Finance"]
          missing = [x for x in required if x not in cfg_text]
          if missing:
              raise SystemExit("Missing v0.3.3 UI markers: " + repr(missing))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: ashare_widget_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="ashare_widget_project/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree --file res/layout/widget_row.xml "$APK" | tee widget_row_dump.txt
          if grep -q 'android.view.View' widget_row_dump.txt; then
            echo "Unexpected android.view.View in compiled widget resource"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashare-widget-v0.3.3-debug-apk
          path: ashare_widget_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

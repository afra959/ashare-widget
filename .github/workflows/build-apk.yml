name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Restore source archive
        shell: bash
        run: |
          cat .buildsrc/chunk_*.b64 > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip
          test -f ashare_widget_project/settings.gradle
      - name: Apply v0.3.1 RemoteViews compatibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ashare_widget_project/app/src/main/res/layout/widget_row.xml")
          s = p.read_text()
          old = '''    <View
                  android:layout_width="match_parent"
                  android:layout_height="1dp"
                  android:background="#293240" />'''
          new = '''    <TextView
                  android:layout_width="match_parent"
                  android:layout_height="1dp"
                  android:background="#293240"
                  android:text="" />'''
          if old not in s:
              raise SystemExit("Expected separator View not found")
          p.write_text(s.replace(old, new))
          b = Path("ashare_widget_project/app/build.gradle")
          t = b.read_text().replace("versionCode 3", "versionCode 4").replace("versionName '0.3.0'", "versionName '0.3.1'")
          b.write_text(t)
          PY
          ! grep -R '<View[ >]' ashare_widget_project/app/src/main/res/layout/widget_*.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build debug APK
        working-directory: ashare_widget_project
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashare-widget-v0.3.1-debug-apk
          path: ashare_widget_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

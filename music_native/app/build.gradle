plugins {
    id 'com.android.application'
}

android {
    namespace 'com.afra.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.afra.music"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
